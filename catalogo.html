<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo | TechNova</title>
<meta name="description" content="Catálogo completo de laptops, PCs, componentes, monitores y periféricos con filtros.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="header"></header>
<main class="section"><div class="wrap">
  <h2>Catálogo</h2><p class="sub">Filtra por categoría, marca, uso y precio</p>
  <div class="layout">
    <aside class="filters">
      <div><label for="q">Buscar</label><input id="q" type="search" placeholder="Ej: laptop, RTX, 16 GB"></div>
      <div><label for="cat">Categoría</label><select id="cat"></select></div>
      <div><label for="marca">Marca</label><select id="marca"></select></div>
      <div><label for="uso">Uso</label><select id="uso"></select></div>
      <div><label for="max">Precio máximo: <b id="maxv"></b></label><input id="max" type="range" step="10"></div>
      <div><label><input id="oferta" type="checkbox" style="width:auto;margin-right:6px">Solo ofertas</label></div>
      <button class="btn btn-ghost" id="limpiar">Limpiar filtros</button>
    </aside>
    <section>
      <div class="result-bar">
        <span id="n"></span>
        <select id="orden" style="width:auto">
          <option value="">Orden: destacados</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
          <option value="az">Nombre A-Z</option>
        </select>
      </div>
      <div class="grid" id="lista"></div>
    </section>
  </div>
</div></main>
<footer id="footer"></footer>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
